name: AGMEN checks
on: [push, pull_request]
jobs:
  application:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -r requirements-dev.txt
      - run: npm ci && npm run build
        working-directory: frontend
      - run: python -m pytest -q
        env:
          OMP_NUM_THREADS: '2'
          MKL_NUM_THREADS: '2'
          OPENBLAS_NUM_THREADS: '2'
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Start application and wait for health
        run: |
          python launch_agmen.py --serve > /tmp/agmen-ci.log 2>&1 &
          python - <<'PY'
          import time, urllib.request
          for attempt in range(90):
              try:
                  urllib.request.urlopen('http://127.0.0.1:7860/api/health', timeout=2)
                  break
              except OSError:
                  time.sleep(1)
          else:
              raise SystemExit('AGMEN healthcheck failed')
          PY
      - run: npm run test:territory-hooks && npm run test:smoke && npm run test:research && npm run test:connection && npm run test:territory && npm run test:arrival && npm run test:themes
        working-directory: frontend
        env:
          AGMEN_PYTHON: python
      - run: docker build -t agmen:test .
      - run: docker build -f Dockerfile.edge -t agmen-edge:test .
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-diagnostics
          path: test-results/
          retention-days: 3
